<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Police Reports</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>POLICE REPORTS</h1>
<a href="index.html">← BACK</a>
</header>

<main>

<div class="cards-container">

    <div class="card special">
        <h3>ADD REPORT</h3>

        <input id="applicant_id" placeholder="applicant_id">
        <input id="time_place_id" placeholder="time_place_id">

        <select id="requests">
            <option value="true">requests true</option>
            <option value="false">requests false</option>
        </select>

        <select id="familiarw_article">
            <option value="true">familiarw_article true</option>
            <option value="false">familiarw_article false</option>
        </select>

        <input id="report_date" type="date">
        <input id="report_time" type="time">

        <input id="applying_methods_id" placeholder="applying_methods_id">
        <input id="employee_id" placeholder="employee_id">

        <select id="urgency">
            <option value="true">urgency true</option>
            <option value="false">urgency false</option>
        </select>

        <button onclick="addReport()">ADD</button>
        <button onclick="loadReports()">LOAD</button>
    </div>

</div>

<div class="cards-container" id="list"></div>

</main>

<script src="police_reports.js"></script>

</body>
</html>
